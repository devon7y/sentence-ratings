<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sentence ratings</title>
<style>
  html, body { margin: 0; background: #fff; color: #000; }
  body { font: 18px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #top { display: flex; justify-content: space-between; padding: 0.6rem 1.5rem; font-size: 0.8rem; color: #666; min-height: 1.2rem; }
  #top a { color: #666; cursor: pointer; text-decoration: underline; }
  #warn { padding: 0 1.5rem; font-weight: bold; }
  #main { max-width: 62rem; margin: 0 auto; padding: 1rem 1.5rem 3rem; }
  #main.wide { max-width: 86rem; }
  h1 { font-size: 1.3rem; margin: 0 0 1rem; }
  p { margin: 0 0 0.9rem; }
  .label { color: #666; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 0.15rem; }
  .construct { font-weight: bold; margin: 0 0 0.6rem; }
  .definition { margin: 0 0 1.4rem; }
  .sentence { font-size: 1.35rem; line-height: 1.5; margin: 0 0 2rem; }
  .question { color: #666; font-size: 0.9rem; margin: 0 0 0.6rem; }
  .keys { display: flex; justify-content: space-between; border-top: 1px solid #ccc; padding-top: 0.7rem; }
  .keys b { font-family: Menlo, Consolas, monospace; border: 1px solid #000; padding: 0 0.45rem; margin-right: 0.4rem; }
  .hint { color: #666; font-size: 0.8rem; margin-top: 1.5rem; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2.5rem; align-items: start; }
  ol.items { margin: 0; padding-left: 2.2rem; font-size: 0.95rem; line-height: 1.4; }
  ol.items li { margin: 0 0 0.3rem; }
  .itemsbox { max-height: calc(100vh - 6rem); overflow-y: auto; }
  ol.items.cols { columns: 2; column-gap: 3rem; }
  input[type=text] { font: inherit; padding: 0.3rem 0.5rem; border: 1px solid #000; width: 14rem; }
  button { font: inherit; padding: 0.3rem 0.9rem; border: 1px solid #000; background: #fff; color: #000; cursor: pointer; margin-right: 0.5rem; }
  ul.plain { margin: 0 0 0.9rem; padding-left: 1.2rem; }
</style>
</head>
<body>
<div id="top"><span id="progress"></span><span id="tools"></span></div>
<div id="warn"></div>
<div id="main">Loading.</div>
<script src="app.js"></script>
</body>
</html>
